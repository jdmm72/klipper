[gcode_macro AUTOBIM_FINISH]
description:  Actions to run after Octoprint AutoBIM
variable_bed_mesh_calibrated: False
gcode:
  {% set prefix = params.PREFIX | default("AUTOBIM_FINISH: ") | string %}
  {% set callback = params.CALLBACK | default("AUTOBIM_FINISH") | string %}
  {% set bed_mesh_calibrated = params.BED_MESH_CALIBRATED | default(printer["gcode_macro AUTOBIM_FINISH"].bed_mesh_calibrated) | string %}
  
  {% if bed_mesh_calibrated %}
    LOG_MESSAGE PREFIX="{prefix}" MESSAGE="Bed Leveling"
    DELETE_ALL_BED_MESHES
    MESH_CALIBRATE_TEMP CALLBACK="{callback}"; do Mesh Calibrate and configure for saving after print.
	SET_GCODE_VARIABLE MACRO=AUTOBIM_FINISH VARIABLE=bed_mesh_calibrated VALUE=True
  {% else %}
    SET_GCODE_VARIABLE MACRO=AUTOBIM_FINISH VARIABLE=bed_mesh_calibrated VALUE=False
    BED_MESH_OUTPUT ; output bed mesh for BedLevelVisualizer
    UNSET_HEATER_TIMEOUT
	SET_IS_PRINTING IS_PRINTING=FALSE
    JOB_OVER SAVE_CONFIG=True M="AutoBIM Finished"
  {% endif %}
  
[gcode_macro AUTOBIM_START]
description:  Actions to run before Octoprint AutoBIM
gcode:
  {% set prefix = params.PREFIX | default("AutoBIM:") | string %}
  {% set bed_target = params.TEMPERATURE | default(printer.heater_bed.target) | int %} 
  {% set callback = params.NEXT_COMMAND | default("RESUME_ACTION") | string %}
  
  {% if default_bed_target == 0 %}
    {% set bed_target = printer.save_variables.variables.default_heater_bed_target | int %}
  {% endif %}
  
  SET_IS_PRINTING IS_PRINTING=TRUE
  SET_HEATER_TIMEOUT
  LOG_MESSAGE LEVEL="INFO" PREFIX="{prefix}" MESSAGE="Heating"
  START_INTERRUPTIBLE_HEAT BED_TARGET={bed_target} EXTRUDER_TARGET=0.0
  
[gcode_macro BEDREADY_START]
gcode:
  {% set prefix = params.PREFIX | default("BEDREADY_START") | string %}
  
  LOG_MESSAGE LEVEL="INFO" PREFIX="{prefix}" MESSAGE="Starting BedReady pre-routine."
  CHECK_HOMED_AXES
  G90
  G0 X0 Y90 Z165 F500
  M400
  LOG_MESSAGE LEVEL="INFO" PREFIX="{prefix}" MESSAGE="Finished BedReady pre-routine."
  
[gcode_macro CANCEL_JOB]
description: Macro to cancel print from Octoprint
gcode:
  JOB_OVER M="Print Cancelled"
  
[gcode_macro CHECK_BED_MESH]
variable_callback: "CHECK_BED_MESH"
variable_level_bed: False
variable_mesh_name_resolved: False
variable_prefix: "CHECK_BED_MESH: "
variable_previous_callback: ""
gcode:
  {% set macro = printer["gcode_macro CHECK_BED_MESH"] %}
  {% set mesh_name_resolved = macro.mesh_name_resolved | lower in ['true', 'yes', 'on', '1'] %}
  
  {% if not mesh_name_resolved %}
    {% set callback = macro.callback | string %}
	{% set level_bed = params.LEVEL_BED | default(False) | lower in ['true', 'yes', 'on', '1'] %}
	{% set prefix = params.PREFIX | default("CHECK_BED_MESH: ") | string %}
	{% set previous_callback = params.CALLBACK | default("") | string %}
  
    SET_GCODE_VARIABLE MACRO=CHECK_BED_MESH VARIABLE=callback VALUE="'{callback}'"
	SET_GCODE_VARIABLE MACRO=CHECK_BED_MESH VARIABLE=mesh_name_resolved VALUE=True
	SET_GCODE_VARIABLE MACRO=CHECK_BED_MESH VARIABLE=level_bed VALUE={level_bed}
	SET_GCODE_VARIABLE MACRO=CHECK_BED_MESH VARIABLE=prefix VALUE="'{prefix}'"
	SET_GCODE_VARIABLE MACRO=CHECK_BED_MESH VARIABLE=previous_callback VALUE="'{previous_callback}'"
	
	LOG_MESSAGE LEVEL="INFO" PREFIX="{prefix}" MESSAGE="Getting Mesh Name."
	GET_MESH_NAME
	DELAYED_START COMMAND="{callback}"
  {% else %}
	{% set level_bed = macro.level_bed | lower in ['true', '1', 'yes'] %}
    {% set mesh_name = printer["gcode_macro GET_MESH_NAME"].mesh_name | string  %}
	{% set prefix = macro.prefix | string  %}
	{% set previous_callback = macro.previous_callback | string %}
	
    SET_GCODE_VARIABLE MACRO=CHECK_BED_MESH VARIABLE=mesh_name_resolved VALUE=False
	
    STEPPER_TIMEOUT_START COMMAND="OFF"
	LOG_MESSAGE LEVEL="INFO" PREFIX="{prefix}" MESSAGE="Checking for Bed Mesh with name: {mesh_name}"
	CHECK_HOMED_AXES
	{% if mesh_name in printer.bed_mesh.profiles and not level_bed %} ; bed mesh found and new one not requested
      LOG_MESSAGE LEVEL="INFO" PREFIX="{prefix}" MESSAGE="Found existing mesh: {mesh_name}. Loading..."
      BED_MESH_PROFILE LOAD={mesh_name} ; load bed mesh
	  DELAYED_START COMMAND="{previous_callback}"
	{% else %} ; bed mesh not found
      LOG_MESSAGE LEVEL="INFO" PREFIX="{prefix}" MESSAGE="No mesh found for {bed_target}C. Calibrating now..."
      MESH_CALIBRATE_TEMP CALLBACK="{previous_callback}"; create new bed mesh
    {% endif %}
  {% endif %}
  
[gcode_macro CHECK_HOMED_AXES]
description:  Check for all homed axes, and home if not.
gcode:
  {% set axes = [] %}
  {% set homed_axes = printer.toolhead.homed_axes %}
  
  {% if "x" not in homed_axes %}{% set _ = axes.append('X') %}{% endif %}
  {% if "y" not in homed_axes %}{% set _ = axes.append('Y') %}{% endif %}
  {% if "z" not in homed_axes %}{% set _ = axes.append('Z') %}{% endif %}
  
  {% if axes|length > 0 %}
    G28 { axes|join(' ') }
  {% endif %}
  
[gcode_macro CHECK_TEMPS_AND_TARGETS]
variable_is_ready: False
gcode:
  {% set bed_target = params.BED_TARGET | default(0.0) | float %}
  {% set bed_temp = printer.heater_bed.temperature | float %}
  {% set callback = params.CALLBACK | default("") | string %}
  {% set extruder_target = params.EXTRUDER_TARGET | default(0.0) | float %}
  {% set extruder_temp = printer.extruder.temperature | float %}
  {% set prefix = params.PREFIX | default("CHECK_TEMPS_AND_TARGETS: ") | string %}
  {% set tolerance = params.TOLERANCE | default(printer.save_variables.variables.tolerance) | float %}
  
  {% if (bed_target == 0.0 or (bed_temp >= (bed_target - tolerance) and bed_temp <= (bed_target + tolerance))) and (extruder_target == 0.0 or (extruder_temp >= (extruder_target - tolerance) and extruder_temp <= (extruder_target + tolerance))) %}
	  SET_GCODE_VARIABLE MACRO=CHECK_TEMPS_AND_TARGETS VARIABLE=is_ready VALUE=True
  {% else %}
    SET_GCODE_VARIABLE MACRO=CHECK_TEMPS_AND_TARGETS VARIABLE=is_ready VALUE=False
  {% endif %}
  DELAYED_START COMMAND="{callback}"
  
[gcode_macro DELAYED_START]
variable_command: ""
gcode:
  {% set prefix = "DELAYED_START: " | string %}
  {% set delay = params.DELAY | default(1) | int %}
  {% set command = params.COMMAND | default("") | string %}
  
  SET_GCODE_VARIABLE MACRO=DELAYED_START VARIABLE=command VALUE="'{command}'"
  LOG_MESSAGE PREFIX="{prefix}" LEVEL="INFO" MESSAGE="COMMAND: {command}" 
  UPDATE_DELAYED_GCODE ID=DELAY_START DURATION={delay}
  
[gcode_macro DELETE_ALL_BED_MESHES]
description: Removes ALL saved bed mesh profiles dynamically and saves config
gcode:
  BED_MESH_CLEAR
  {% if printer.bed_mesh.profiles %}
    {% for profile in printer.bed_mesh.profiles %}
      BED_MESH_PROFILE REMOVE={profile}
    {% endfor %}
    SAVE_CONFIG
  {% else %}
    {action_respond_info("No saved bed mesh profiles to remove.")}
  {% endif %}

[gcode_macro DRY_FILAMENT]
description:  Macro to dry filament on bed
variable_preheat: True
variable_x_pos: 117.5
variable_y_pos: 117.5
variable_z_pos: 70.0
variable_prefix: "DRY_FILAMENT:"
gcode:
  {% set preheat = params.PREHEAT | default(printer["gcode_macro CHECK_BED_MESH"].preheat_bed) | lower in ['true', '1', 'yes'] %}
  
  {% if preheat %}
    {% set bed_target = params.T | default(60) | float %}
	{% set x_pos = params.X | default(117.5) | float %}
    {% set y_pos = params.Y | default(117.5) | float %}
    {% set z_pos = params.Z | default(70.0) | float %}
	{% set callback = "DRY_FILAMENT" %}
	{% set prefix = params.PREFIX | default("DRY_FILAMENT:") | string %}
	
    SET_GCODE_VARIABLE MACRO=DRY_FILAMENT VARIABLE=preheat VALUE=False
	SET_GCODE_VARIABLE MACRO=DRY_FILAMENT VARIABLE=x_pos VALUE={x_pos}
	SET_GCODE_VARIABLE MACRO=DRY_FILAMENT VARIABLE=y_pos VALUE={y_pos}
	SET_GCODE_VARIABLE MACRO=DRY_FILAMENT VARIABLE=z_pos VALUE={z_pos}
	SET_GCODE_VARIABLE MACRO=DRY_FILAMENT VARIABLE=prefix VALUE="'{prefix}'"
	
	START_INTERRUPTIBLE_HEAT BED_TARGET={bed_target} CALLBACK="{callback}"
  {% else %}
    {% set x_pos = printer["gcode_macro DRY_FILAMENT"].x_pos | float %}
    {% set y_pos = printer["gcode_macro DRY_FILAMENT"].y_pos | float %}
    {% set z_pos = printer["gcode_macro DRY_FILAMENT"].z_pos | float %}
	{% set prefix = printer["gcode_macro DRY_FILAMENT"].prefix | string %}
	
    G1 X{x_pos} Y{y_pos} Z{z_pos}
    LOG_MESSAGE PREFIX="{prefix}" MESSAGE="Drying Filament"
	SET_GCODE_VARIABLE MACRO=DRY_FILAMENT VARIABLE=preheat VALUE=True
  {% endif %}
  
[gcode_macro ENCLOSURE_FAN]
description:  Turn enclosure fan on/off, using log message to octoprint
variable_enclosure_fan_on: False
gcode:
  {% set command = params.COMMAND | default(False) | lower in ['true', 'yes', 'on', '1'] %}
  {% set postfix = "ON" if command else "OFF" | string %}
  {% set prefix = params.PREFIX | default("ENCLOSURE FAN:") | string %}
  {% set timeout_enabled = params.TIMEOUT_ENABLED | default(False, True) | lower in ['true', 'yes', 'on', '1'] %}
  {% set timeout_period = params.TIMEOUT_PERIOD | default(300) | int %}
  
  LOG_MESSAGE PREFIX="{prefix}" DISPLAY=False LOG=True MESSAGE="ENCLOSURE_FAN_{postfix}"
  {% if timeout_enabled and timeout_period > 0 %}
	UPDATE_DELAYED_GCODE ID=ENCLOSURE_FAN_TIMEOUT DURATION={timeout_period}
  {% else %}
    UPDATE_DELAYED_GCODE ID=ENCLOSURE_FAN_TIMEOUT DURATION=0
  {% endif %}
  
  {% if command %}
    SET_GCODE_VARIABLE MACRO=ENCLOSURE_FAN VARIABLE=enclosure_fan_on VALUE=True
  {% else %}
    SET_GCODE_VARIABLE MACRO=ENCLOSURE_FAN VARIABLE=enclosure_fan_on VALUE=False
  {% endif %}
  
[gcode_macro END_PRINT]
description:  Macro to end print from Octoprint
gcode:
  JOB_OVER M="Print Finished"
  
[gcode_macro FAN_TEMPERATURE_ADJUST]
description:  Calls the PREHEAT_FAN_ADJUST delayed gcode_macro
variable_fan_loop: False
variable_fan_speed_change_increment: 0
variable_fan_speed_percentage: 0
variable_fan_speed_change_direction: 0
gcode:
  {% set duration=params.DURATION | default(5) | int %}
  {% set command=params.COMMAND | default("off") | lower in ['true', 'yes', 'on', '1'] %}
	
  {% if command %}
    UPDATE_DELAYED_GCODE ID=PREHEAT_FAN_ADJUST DURATION={duration}
	SET_GCODE_VARIABLE MACRO=FAN_TEMPERATURE_ADJUST VARIABLE=fan_loop VALUE=True
  {% else %}
	UPDATE_DELAYED_GCODE ID=PREHEAT_FAN_ADJUST DURATION=0
	SET_GCODE_VARIABLE MACRO=FAN_TEMPERATURE_ADJUST VARIABLE=fan_loop VALUE=False
  {% endif%}
  
[gcode_macro GET_MESH_NAME]
variable_mesh_name: ""
gcode:
	{% set bed_target = printer.heater_bed.target | float %}
	{% set mesh_name = bed_target ~ "bed_mesh" | string %}
	{% set prefix = params.PREFIX | default("GET_MESH_NAME") | string %}
	LOG_MESSAGE LEVEL="INFO" PREFIX="{prefix}" MESSAGE="Generating Mesh Name."
	SET_GCODE_VARIABLE MACRO=GET_MESH_NAME VARIABLE=mesh_name VALUE="'{mesh_name}'"

[gcode_macro JOB_OVER]
description:  Macro to finish a print job
variable_save_config: False
gcode:
  {% set save_config = params.SAVE_CONFIG | default(printer["gcode_macro JOB_OVER"].save_config) | lower in ['true', 'yes', 'on', '1'] %}
  {% set prefix = params.PREFIX | default("JOB OVER:") | string %}
  {% set message = params.M | default("Job Finished") | string %}
  
  SAVE_VARIABLE VARIABLE=is_printing VALUE=False
	
  SAFE_RETRACT
  PARK_HEAD
  ENCLOSURE_FAN COMMAND="ON" TIMEOUT_ENABLED="TRUE";
  LOG_MESSAGE PREFIX="{prefix}" MESSAGE="{message}"
  SET_IS_PRINTING IS_PRINTING=False
  {% if save_config %}
    SET_GCODE_VARIABLE MACRO=JOB_OVER VARIABLE=save_config VALUE=False
    SAVE_CONFIG
  {% else %}
	SET_HEATER_TEMPERATURE HEATER=extruder ; Turn off Exturder Heater
	UNSET_HEATER_TIMEOUT
	FAN_TEMPERATURE_ADJUST
	BED_MESH_CLEAR ; Clear the previously loaded bed mesh.
  {% endif %}
  
[gcode_macro LOAD_FILAMENT]
description: Macro to load filament
gcode:
  {% set min_extrude_temp = printer.configfile.settings.extruder.min_extrude_temp %}
  {% set extruder_target = printer.extruder.target %}
  {% set default_temperature=extruder_target if extruder_target>min_extrude_temp else 225 %}
  {% set temperature=params.T | default(default_temperature) | float %}
  {% set load_length=params.LOAD_LENGTH | default(110.0) | float %}
  {% set speed=params.SPEED | default(500) | int %}
  {% set message=params.MESSAGE | default("Load Complete") | string %}
  {% set prefix=params.PREFIX | default("LOAD_FILAMENT:") | string %}
  
  PURGE_FILAMENT TEMPERATURE={temperature} PURGE_AMOUNT={load_length} SPEED={speed} MESSAGE="{message}" PREFIX="{PREFIX}"

[gcode_macro LOG_MESSAGE]
description:  Standardized way to log message to display and terminal
gcode:
  {% set message = params.MESSAGE | default("") | string %}
  {% set display = params.DISPLAY | default(True, False) | lower in ['true', 'yes', '1', 'on', ''] %}
  {% set log = params.LOG | default(True, False) | lower in ['true', 'yes', '', 'on'] %}
  {% set prefix = params.PREFIX | default("echo") | string %}
  {% set log_level = printer.save_variables.variables.log_level | upper %}
  {% set level = params.LEVEL | default("INFO") | upper | string %}

  {% if display %}
	SET_DISPLAY_TEXT MSG="{message}"
  {% endif %}
  {% if log and (level == "INFO" or log_level == "DEBUG") %} 
	{% set prefix_lower = prefix | lower %}
	
	{% if prefix_lower == "echo" or prefix_lower == "command" or prefix_lower == "error" %}
	  RESPOND TYPE="{prefix | lower}" MSG="{message}"
	{% else %}
	  RESPOND PREFIX="{prefix}" MSG="{message}"
	{% endif %}
  {% endif %}

[gcode_macro MESH_CALIBRATE_TEMP]
description: Calibrate bed mesh and save as <temperature>bed_mesh
variable_previous_callback: ""
#variable_preheat: True
#variable_prefix: "MESH_CALIBRATE_TEMP: "
#variable_message: "Leveling Bed"
#variable_skip_home: False
variable_mesh_name_resolved: False
variable_callback: "MESH_CALIBRATE_TEMP"
gcode:
  {% set macro = printer["gcode_macro MESH_CALIBRATE_TEMP"] %}
  {% set mesh_name_resolved = macro.mesh_name_resolved | lower in ['true', 'yes', 'on', '1'] %}
  
  {% if not mesh_name_resolved %}
    {% set previous_callback = params.CALLBACK | default("") | string %}
	
    SET_GCODE_VARIABLE MACRO=MESH_CALIBRATE_TEMP VARIABLE=mesh_name_resolved VALUE=True
	SET_GCODE_VARIABLE MACRO=MESH_CALIBRATE_TEMP VARIABLE=previous_callback VALUE={previous_callback}
	
    GET_MESH_NAME
	DELAYED_START COMMAND="MESH_CALIBRATE_TEMP"
  {% else %}
	{% set mesh_name = printer["gcode_macro GET_MESH_NAME"].mesh_name | string %}
	{% set previous_callback = macro.previous_callback | string %}
	  
	SET_GCODE_VARIABLE MACRO=MESH_CALIBRATE_TEMP VARIABLE=mesh_name_resolved VALUE=False
	  
	CHECK_HOMED_AXES
    BED_MESH_CALIBRATE
    BED_MESH_PROFILE SAVE="{mesh_name}"
	SAVE_VARIABLE VARIABLE=save_config VALUE=True
	DELAYED_START COMMAND="{previous_callback}"
  {% endif %}
	
[gcode_macro MOVE_UP]
description:  A forced moved, this may be an unsafe move.
gcode:
  {% set z_hop = params.Z | default(10.0) | float %}
  {% set prefix = params.PREFIX | default("MOVE UP:") | string %}
  {% set is_homed = "True" %}
  {% if "z" not in printer.toolhead.homed_axes %} ; z not homed
    LOG_MESSAGE LEVEL="INFO" PREFIX="{prefix}" MESSAGE="Z not homed."
	SET_KINEMATIC_POSITION Z=125 ; Tell printer Z is currently 125 to allow it to travel in either direction
	{% set is_homed = "False" %}
  {% endif %}
  G91 ; Relative positioning
  {% if printer.toolhead.position.z <= (250.0 - z_hop) %}
    G0 Z{z_hop} F600; Move Z up 10mm
  {% else %}
	LOG_MESSAGE PREFIX="INFO: " MESSAGE="Move out of limits."
  {% endif %}
  {% if is_homed == "False" %}
    M84
  {% endif %}	

[gcode_macro PARK_HEAD]
description: Move the extruder to the parked position
gcode:
  {% set interference_x = params.X_TARGET | default(10.0) | float %}
  {% set non_interference_x = params.X_TARGET | default(-3.0) | float %}
  {% set prefix = params.PREFIX | default("PARK HEAD: ") | string %}
  {% set safe_z = params.SAFE_Z | default(175.0) | float %}
  {% set z_pos = printer.toolhead.position.z | float %}

  LOG_MESSAGE LEVEL="INFO" PREFIX="{prefix}" MESSAGE="Parking Head"
  {% if "xy" not in printer.toolhead.homed_axes %}
    G28 X Y ; home x and y
  {% endif %}
  G90 ; Absolute Positioning
  G0 Y219 F50000; Park with model at front
  {% if z_pos <= safe_z %}
    {% set x_target = non_interference_x %}
  {% else %}
    {% set x_target = interference_x %}
  {% endif %}
  G0 X{x_target}
  M400
  LOG_MESSAGE LEVEL="INFO" PREFIX="{prefix}" MESSAGE="Head Parked"

[gcode_macro PAUSE_ACTION]
description: Actions to take after pause
variable_extruder_target: 0
variable_bed_target: 0
variable_enclosure_fan_on: False
variable_purge: False
gcode:
  {% set message = params.MESSAGE | default("Print Paused") | string %}
  {% set prefix = params.PREFIX | default("PAUSE ACTION:") | string %}
  {% set enclosure_fan = params.ENCLOSURE_FAN | default("ON") | upper | string %}
  {% set bed_target = params.BED_TARGET | default(printer.heater_bed.target) | float %}
  {% set extruder_target = params.EXTRUDER_TARGET | default(printer.extruder.target) | float %}
  {% set enclosure_fan_on = params.ENCLOSURE_FAN_ON | default(printer['gcode_macro ENCLOSURE_FAN'].enclosure_fan_on) | lower in ['true', 'yes', 'on', '1'] %}
  {% set purge = params.PURGE | default(True) | lower in ['true', 'yes', 'on', '1'] %}
  
  {% if not printer.pause_resume.is_paused %}
    SET_GCODE_VARIABLE MACRO=PAUSE_ACTION VARIABLE=extruder_target VALUE={extruder_target}
    SET_GCODE_VARIABLE MACRO=PAUSE_ACTION VARIABLE=bed_target VALUE={bed_target}
    SET_GCODE_VARIABLE MACRO=PAUSE_ACTION VARIABLE=enclosure_fan_on VALUE={enclosure_fan_on}
    SET_GCODE_VARIABLE MACRO=PAUSE_ACTION VARIABLE=purge VALUE={purge}
	
    PAUSE
    LOG_MESSAGE PREFIX="{prefix}" MESSAGE="Pausing Print"
    SAFE_RETRACT
    LOG_MESSAGE PREFIX="{prefix}" MESSAGE="{message}"
    PARK_HEAD
    SET_HEATER_TIMEOUT
    G90 ; absolution positioning
    ENCLOSURE_FAN COMMAND={enclosure_fan}
    FAN_TEMPERATURE_ADJUST COMMAND="ON" 
  {% else %}
    LOG_MESSAGE PREFIX="{prefix}" MESSAGE="Printer already paused"
  {% endif %}
  
[gcode_macro PURGE_FILAMENT]
description:  Macro to purge filament
gcode:
  {% set prefix = params.PREFIX | default("PURGE_FILAMENT: ") | string %}
  {% set purge_amount = params.PURGE_AMOUNT | default(10.0) | float %}
  {% set speed = params.SPEED | default(500) | int %}
  {% set skip_home = params.SKIP_HOME | default(False) | lower in ['true', '1', 'yes'] %}
      
  LOG_MESSAGE LEVEL="INFO" PREFIX="{prefix}" MESSAGE="Purge Started"
  SAVE_GCODE_STATE NAME=purge_filament_state ; save_state
  {% if not skip_home %}
    CHECK_HOMED_AXES
  {% endif %}
  PARK_HEAD
  G91
  G0 E{purge_amount} F{speed}
  RESTORE_GCODE_STATE NAME=purge_filament_state
  M400
  LOG_MESSAGE LEVEL="INFO" PREFIX="{prefix}" MESSAGE="Purge Complete"

  
[gcode_macro RESUME_ACTION]
description: Actions to take before resume
variable_preheat: True
variable_prefix: "RESUME_ACTION: "
variable_enclosure_fan_on: True
variable_extruder_target: 225.0
variable_bed_target: 70.0
variable_previous_callback: ""
gcode:
  {% set preheat = params.PREHEAT | default(printer["gcode_macro RESUME_ACTION"].preheat) | lower in ['true', '1', 'yes'] %}
  {% set callback = "RESUME_ACTION" | string %}
  {% set previous_callback = params.CALLBACK | default("") | string %}
  
  {% if printer.pause_resume.is_paused %}
    {% if preheat %}
      {% set prefix = params.PREFIX | default("RESUME_ACTION: ") | string %}
	  {% set enclosure_fan_on = params.ENCLOSURE_FAN_ON | default(printer['gcode_macro PAUSE_ACTION'].enclosure_fan_on) | lower in ['true', '1', 'yes'] %}
	  {% set extruder_target =  params.EXTRUDER_TARGET | default(printer['gcode_macro PAUSE_ACTION'].extruder_target) | float %}
	  {% set bed_target = params.BED_TARGET | default(printer['gcode_macro PAUSE_ACTION'].bed_target) | float %}
	
	  SET_GCODE_VARIABLE MACRO=RESUME_ACTION VARIABLE=prefix VALUE="'{prefix}'"
	  SET_GCODE_VARIABLE MACRO=RESUME_ACTION VARIABLE=enclosure_fan_on VALUE={enclosure_fan_on}
	  SET_GCODE_VARIABLE MACRO=RESUME_ACTION VARIABLE=extruder_target VALUE={extruder_target}
	  SET_GCODE_VARIABLE MACRO=RESUME_ACTION VARIABLE=bed_target VALUE={bed_target}
      SET_GCODE_VARIABLE MACRO=RESUME_ACTION VARIABLE=preheat VALUE=False
	  SET_GCODE_VARIABLE MACRO=RESUME_ACTION VARIABLE=previous_callback VALUE="'{previous_callback}'"
	  
	  UNSET_HEATER_TIMEOUT
      SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed_target}
      SET_HEATER_TEMPERATURE HEATER=extruder TARGET={extruder_target}
	  
	  PARK_HEAD
	  START_INTERRUPTIBLE_HEAT BED_TARGET={bed_target} EXTRUDER_TARGET={extruder_target} CALLBACK="{callback}"
    {% else %} 
      {% set prefix = printer["gcode_macro RESUME_ACTION"].prefix | string %}
	  {% set enclosure_fan_on = printer["gcode_macro RESUME_ACTION"].prefix | lower in ['true', '1', 'yes'] %}
	  
	  SET_GCODE_VARIABLE MACRO=RESUME_ACTION VARIABLE=preheat VALUE=True
	
      G11
	  PURGE_FILAMENT
	  LOG_MESSAGE DISPLAY=FALSE PREFIX="{prefix}" MESSAGE="Resuming"
      UNSET_HEATER_TIMEOUT
      PARK_HEAD
      FAN_TEMPERATURE_ADJUST COMMAND="OFF"
      M107; fans off
      RESUME
	  ENCLOSURE_FAN COMMAND={enclosure_fan_on}
	  G90
    {% endif %}
  {% else %}
    LOG_MESSAGE PREFIX="{prefix}" MESSAGE="Printer not paused."
  {% endif %}
  
[gcode_macro SAFE_RETRACT]
variable_callback: ""
gcode:
  {% set min_extrude_temp = printer.configfile.settings.extruder.min_extrude_temp %}
  {% set extruder_temp = printer.extruder.temperature %}

  {% if extruder_temp > min_extrude_temp %}
    G10 ; Retract to prevent oozing
  {% endif %}
  
[gcode_macro SCREWS_TILT_CALCULATE]
rename_existing: SCREWS_TILT_CALCULATE_BASE
gcode:
  BED_MESH_CLEAR
  DELETE_ALL_BED_MESHES
  SCREWS_TILT_CALCULATE_BASE {raw_params}
  
  
[gcode_macro SET_HEATER_TIMEOUT]
gcode:
  {% set printing = printer.save_variables.variables.is_printing | lower in ['true', 'yes', 'on'] %}
  {% set idle_bed_timeout = printer.save_variables.variables.idle_timeout | int %}
  {% set idle_extruder_timeout = printer.save_variables.variables.idle_extruder_timeout | int %}
  {% set pause_bed_timeout=printer.save_variables.variables.pause_timeout | int %}
  {% set pause_extruder_timeout=printer.save_variables.variables.pause_extruder_timeout | int %}
  
  {% if printing %}
    UPDATE_DELAYED_GCODE ID=EXTRUDER_TIMEOUT DURATION={pause_extruder_timeout}
    SET_IDLE_TIMEOUT TIMEOUT={pause_bed_timeout}
  {% else %}
    UPDATE_DELAYED_GCODE ID=EXTRUDER_TIMEOUT DURATION={idle_extruder_timeout}
    SET_IDLE_TIMEOUT TIMEOUT={idle_bed_timeout}
  {% endif %}
  
[gcode_macro SET_IS_PRINTING]
gcode:
  {% set is_printing = params.IS_PRINTING | default(False, True) | lower in ['true', 'yes', 'on'] %}
  SAVE_VARIABLE VARIABLE=is_printing VALUE={is_printing}

[gcode_macro START_INTERRUPTIBLE_HEAT]
variable_bed_target: 0.0
variable_extruder_target: 0.0
variable_heat_loop: False
variable_loop_time: 0
variable_prefix: ""
variable_previous_callback: ""
variable_callback: "START_INTERRUPTIBLE_HEAT"
variable_temps_checked: False
gcode:
  {% set macro = printer["gcode_macro START_INTERRUPTIBLE_HEAT"] %}
  {% set temps_checked = macro.temps_checked | lower in ['true', 'yes', 'on', '1'] %}
  {% set is_ready = printer["gcode_macro CHECK_TEMPS_AND_TARGETS"].is_ready | lower in ['true', 'yes', 'on', '1'] %}
  
  {% if not temps_checked %}
    {% set bed_target = params.BED_TARGET | default(printer.heater_bed.target) | float %}	    
	{% set callback = "START_INTERRUPTIBLE_HEAT" | upper | string %}
    {% set extruder_target = params.EXTRUDER_TARGET | default(printer.extruder.target) | float %}
	{% set loop_time = params.LOOP_TIME | default(10) | int %}
    {% set prefix = params.PREFIX | default("START_INTERRUPTIBLE_HEAT: ") | string %}
    {% set previous_callback = params.CALLBACK | default("") | string %}
    
    SET_GCODE_VARIABLE MACRO=START_INTERRUPTIBLE_HEAT VARIABLE=bed_target VALUE={bed_target}
    SET_GCODE_VARIABLE MACRO=START_INTERRUPTIBLE_HEAT VARIABLE=extruder_target VALUE={extruder_target}
	SET_GCODE_VARIABLE MACRO=START_INTERRUPTIBLE_HEAT VARIABLE=loop_time VALUE={loop_time}
	SET_GCODE_VARIABLE MACRO=START_INTERRUPTIBLE_HEAT VARIABLE=prefix VALUE="'{prefix}'"
    SET_GCODE_VARIABLE MACRO=START_INTERRUPTIBLE_HEAT VARIABLE=previous_callback VALUE="'{previous_callback}'"
	SET_GCODE_VARIABLE MACRO=START_INTERRUPTIBLE_HEAT VARIABLE=temps_checked VALUE=True
	
	LOG_MESSAGE PREFIX="{prefix}" LEVEL="INFO" MESSAGE="Checking Temperatures. {previous_callback}" 
	CHECK_TEMPS_AND_TARGETS BED_TARGET={bed_target} EXTRUDER_TARGET={extruder_target} CALLBACK="{callback}"
  {% elif not is_ready %}
	{% set bed_target = printer["gcode_macro START_INTERRUPTIBLE_HEAT"].bed_target | float %}
	{% set extruder_target = printer["gcode_macro START_INTERRUPTIBLE_HEAT"].extruder_target | float %}
	{% set loop_time = printer["gcode_macro START_INTERRUPTIBLE_HEAT"].loop_time | int %}
	{% set prefix = printer["gcode_macro START_INTERRUPTIBLE_HEAT"].prefix | string %}
	  
	SET_GCODE_VARIABLE MACRO=START_INTERRUPTIBLE_HEAT VARIABLE=heat_loop VALUE=True
      
	SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed_target}
	SET_HEATER_TEMPERATURE HEATER=extruder TARGET={extruder_target}
	LOG_MESSAGE PREFIX="{prefix}" LEVEL="INFO" MESSAGE="Starting Heating Loop." 
	CHECK_TEMPS_AND_TARGETS BED_TARGET={bed_target} EXTRUDER_TARGET={extruder_target}
    UPDATE_DELAYED_GCODE ID=HEATING_LOOP DURATION={loop_time}
  {% else %}
	{% set prefix = printer["gcode_macro START_INTERRUPTIBLE_HEAT"].prefix | string %}
	{% set previous_callback = printer["gcode_macro START_INTERRUPTIBLE_HEAT"].previous_callback | string %}
	
	SET_GCODE_VARIABLE MACRO=START_INTERRUPTIBLE_HEAT VARIABLE=temps_checked VALUE=False
	
	LOG_MESSAGE PREFIX="{prefix}" LEVEL="INFO" MESSAGE="Returning to calling function: {previous_callback}." 
	DELAYED_START COMMAND="{previous_callback}"
  {% endif %}
 
[gcode_macro START_PRINT]
description:  Macro to start print from Octoprint
variable_bed_mesh_checked: False
variable_bed_target: 0.0
variable_callback: "START_PRINT"
variable_extruder_target: 0.0
variable_material: "UNK"
variable_prefix: "START_PRINT: "
variable_preheat_bed: True
variable_preheat_extruder: True
variable_skip_z_home: False
variable_stepper_timeout: 600

gcode:
  {% set macro = printer["gcode_macro START_PRINT"] %}
  {% set bed_mesh_checked = params.BED_MESH_CHECKED | default(macro.bed_mesh_checked) | lower in ['true', 'yes', 'on', '1'] %}
  {% set preheat_bed = params.PREHEAT_BED | default(macro.preheat_bed) | lower in ['true', 'yes', 'on', '1'] %}
  {% set preheat_extruder = params.PREHEAT_EXTRUDER | default(macro.preheat_extruder) | lower in ['true', 'yes', 'on', '1'] %}
  
  {% if preheat_bed %}
    {% set bed_target = params.B | default(0.0) | float %}
    {% set callback = params.CALLBACK | default("START_PRINT") | string %}
    {% set extruder_target = params.E | default(0.0) | float %}
	{% set material = params.M | default("UNK") | upper | string %}
    {% set prefix = params.PREFIX | default("START_PRINT: ") | string %} 
    {% set skip_z_home = params.S | default(False) | lower in ['true', 'yes', 'on', '1'] %}
	{% set standby_target = params.STANDBY_TARGET | default(150.0) | float %}
    {% set stepper_timeout = params.STEPPER_TIMEOUT | default(600) | int %}
  
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=bed_mesh_checked VALUE=False
	SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=bed_target VALUE={bed_target}
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=callback VALUE="'{callback}'"
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=extruder_target VALUE={extruder_target}
	SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=material VALUE="'{material}'"
	SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=prefix VALUE="'{prefix}'"
	SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=preheat_bed VALUE=False
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=skip_z_home VALUE={skip_z_home}
	SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=stepper_timeout VALUE={stepper_timeout}
	
	SET_IS_PRINTING IS_PRINTING=TRUE
	
	LOG_MESSAGE PREFIX="{prefix}" LEVEL="INFO" MESSAGE="Preheating Bed. {callback}" 
    M107 ; turn off fans
	ENCLOSURE_FAN COMMAND="OFF"
	CHECK_HOMED_AXES
	G90
	PARK_HEAD
	G0 Z10 F500
	PAUSE
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed_target}
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={standby_target}
	{% if not skip_z_home %}
      STEPPER_TIMEOUT_START COMMAND="ON" DURATION={stepper_timeout}
    {% endif %}
    START_INTERRUPTIBLE_HEAT BED_TARGET={bed_target} EXTRUDER_TARGET={standby_target} CALLBACK="{callback}"
	
  {% elif not bed_mesh_checked %}
    {% set callback = macro.callback | string %}
	{% set prefix = macro.prefix | string %}
	{% set skip_z_home = macro.skip_z_home | lower in ['true', 'yes', 'on', '1'] %}
	
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=bed_mesh_checked VALUE=True 
	
	LOG_MESSAGE PREFIX="{prefix}" LEVEL="INFO" MESSAGE="Checking Bed Mesh." 
	
    SAVE_VARIABLE VARIABLE=save_config VALUE=False
	
	STEPPER_TIMEOUT_START COMMAND="OFF"
	
	{% if not skip_z_home %}
	  {% set homed_axes = printer.toolhead.homed_axes %}
      {% if homed_axes == "xyz" %}
	    G28 Z
	  {% else %}
	    G28
	  {% endif %}
      CHECK_BED_MESH CALLBACK="{callback}"
	{% else %}
	  DELAYED_START COMMAND="{callback}"
    {% endif %}	
	
  {% elif preheat_extruder %}
    {% set bed_target = macro.bed_target | float %}
    {% set callback = macro.callback | string %}
	{% set extruder_target = macro.extruder_target | float %}
	{% set prefix = macro.prefix | string %}
	
	SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=preheat_extruder VALUE=False
	
    LOG_MESSAGE PREFIX="{prefix}" LEVEL="INFO" MESSAGE="Preheating Extruder." 
	STEPPER_TIMEOUT_START COMMAND="OFF"
	PARK_HEAD
	START_INTERRUPTIBLE_HEAT BED_TARGET={bed_target} EXTRUDER_TARGET={extruder_target} CALLBACK="{callback}"
	
  {% else %}
	{% set bed_target = macro.bed_target | float %}
	{% set extruder_target = macro.extruder_target | float %}
	{% set prefix = macro.prefix | string %}
	{% set material = macro.material | upper | string %}
	
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=preheat_bed VALUE=True
	SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=preheat_extruder VALUE=True
	SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=bed_mesh_checked VALUE=False
	
	LOG_MESSAGE PREFIX="{prefix}" LEVEL="INFO" MESSAGE="Resuming and continuing print job." 
	RESUME
	SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed_target}
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={extruder_target}
	PURGE_FILAMENT
	{% if material == "PLA" %}
	  ENCLOSURE_FAN COMMAND="ON"
	{% else %}
	  ENCLOSURE_FAN COMMAND="OFF"
	{% endif %}
	G90
  {% endif %}
  
[gcode_macro STEPPER_TIMEOUT_START]
description:  a macro to call the delayed_gcode STEPPER_TIMEOUT
variable_timeout_enabled: False
gcode:
  {% set duration=params.DURATION | default(60) | int %}
  {% set command=params.COMMAND | default("off") | lower in ['true', 'yes', 'on'] %}
	
  {% if command %}
	UPDATE_DELAYED_GCODE ID=STEPPER_TIMEOUT DURATION={duration}
	SET_GCODE_VARIABLE MACRO=STEPPER_TIMEOUT_START VARIABLE=timeout_enabled VALUE=True
  {% else %}
	UPDATE_DELAYED_GCODE ID=STEPPER_TIMEOUT DURATION=0
	SET_GCODE_VARIABLE MACRO=STEPPER_TIMEOUT_START VARIABLE=timeout_enabled VALUE=False
  {% endif%}
  
[gcode_macro UNLOAD_FILAMENT]
description: Macro to unload filament
gcode:
  {% set min_extrude_temp = printer.configfile.settings.extruder.min_extrude_temp %}
  {% set extruder_target = printer.extruder.target %}
  {% set default_temperature=extruder_target if extruder_target>min_extrude_temp else 225 %}
  {% set temperature=params.T | default(default_temperature) | float %}
  {% set load_length=params.LOAD_LENGTH | default(110.0) | float %}
  {% set speed=params.SPEED | default(500) | int %}
  {% set message=params.MESSAGE | default("Load Complete") | string %}
  {% set prefix=params.PREFIX | default("LOAD_FILAMENT:") | string %}
  
  LOAD_FILAMENT T={temperature} LOAD_LENGTH={load_length * -1} SPEED={speed} MESSAGE="{message}" PREFIX="{prefix}"
  
[gcode_macro UNSET_HEATER_TIMEOUT]
gcode:
  {% set idle_timeout = printer.save_variables.variables.idle_timeout %}
  
  UPDATE_DELAYED_GCODE ID=EXTRUDER_TIMEOUT DURATION=0
  SET_IDLE_TIMEOUT TIMEOUT={idle_timeout}
