[include delayed_gcode.cfg]

[gcode_macro AUTOBIM_FINISH]
description:  Actions to run after Octoprint AutoBIM
gcode:
  SET_DISPLAY_TEXT MSG="Bed Leveling"
  # Get temperatures from slicer (passed as BED_TEMP)
  {% set BED_TEMP = printer.heater_bed.target|default(60)|int %}
  {% set MESH_NAME = BED_TEMP ~ "bed_mesh" %}
  MESH_CALIBRATE_TEMP
  BED_MESH_OUTPUT ; output bed mesh for BedLevelVisualizer
  SAVE_VARIABLE VARIABLE=last_bed_temperature VALUE={printer.heater_bed.target}
  SET_IDLE_TIMEOUT TIMEOUT=900 # Set idle_timeout to 15 minutes
  JOB_OVER MSG="AutoBIM Finished"
  SAVE_CONFIG
  
[gcode_macro AUTOBIM_PREHEAT]
description:  preheat in preparation of Octoprint AutoBIM
gcode:
  {% set BED_TEMP = printer.heater_bed.target | default(70) | int %}
  SET_IDLE_TIMEOUT TIMEOUT=43200 # Set idle_timeout to 12 hours
  PREHEAT T={BED_TEMP} M="AutoBIM Preheat"
  M107
  BED_MESH_CLEAR
  
[gcode_macro CANCEL_JOB]
description: Macro to cancel print from Octoprint
gcode:
  JOB_OVER M="Print Cancelled"
  
[gcode_macro ENCLOSURE_FAN_ON]
gcode:
  RESPOND MSG="ENCLOSURE_FAN_ON"
  

[gcode_macro END_PRINT]
description:  Macro to end print from Octoprint
gcode:
  JOB_OVER M="Print Finished"
  
[gcode_macro HEAT_ON_RESUME]
gcode:
  {% set bed_temp = printer.save_variables.variables.pause_bed_temperature|default(60.0)|float %}
  {% set extruder_temp = printer.save_variables.variables.pause_extruder_temperature|default(60.0)|float %}
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed_temp}
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET={extruder_temp}
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp - 1.0}
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder_temp - 1.0}
  
[gcode_macro JOB_OVER]
description:  Macro to finish a print job
gcode:
  {% set msg = params.M | default("Job Finished") | string %}
  {% set save_after = printer.save_variables.variables.save_config_after_print | default(False) %}
  
  # 1. Capture the current Z position before disabling steppers
  {% set last_z = printer.toolhead.position.z %}
  SAVE_VARIABLE VARIABLE=last_z_pos VALUE={last_z}
  
  SET_DISPLAY_TEXT MSG="Parking"
  G10 ; Firmware Retract
  PARK_HEAD
  M106 S175
  SET_HEATER_TEMPERATURE HEATER=extruder
  UPDATE_DELAYED_GCODE ID=HEATER_BED_TIMEOUT DURATION=3600
  M84 X Y E Z ; Disable all steppers
  BED_MESH_CLEAR ; Clear the previously loaded bed mesh.
  SET_DISPLAY_TEXT MSG="{msg}"
  SAVE_VARIABLE VARIABLE=save_config_after_print VALUE=False
  {% if save_after == True %}
    SAVE_CONFIG
  {% endif %}
  
[gcode_macro MESH_CALIBRATE_TEMP]
description: Calibrate bed mesh and save as <temperature>bed_mesh
gcode:
    {% set BED_TEMP = printer.heater_bed.target | int %}
    {% set MESH_NAME = BED_TEMP ~ "bed_mesh" %}
    G28
    BED_MESH_CALIBRATE
    BED_MESH_PROFILE SAVE={MESH_NAME}
    SAVE_VARIABLE VARIABLE=save_config_after_print VALUE=True

[gcode_macro MOVE_UP]
description:  A forced moved, this may be an unsafe move.
gcode:
  {% set z_hop = params.Z | default(10.0) | float %}
  SAVE_GCODE_STATE NAME=move_up_state
  {% if "z" not in printer.toolhead.homed_axes %}
    { action_respond_info("Z not homed.") }
	SET_KINEMATIC_POSITION Z=0 ; Tell printer Z is currently 0
  {% endif %}
  G91 ; Relative positioning
  {% if printer.toolhead.position.z <= (250.0 - z_hop) %}
    G0 Z{z_hop} F600; Move Z up 10mm
  {% else %}
	action_respond_info("Move out of limits.")
  {% endif %}
  RESTORE_GCODE_STATE NAME=move_up_state
  
[gcode_macro PAUSE_ACTION]
description: Actions to take after pause
gcode:
  PAUSE
  G10 ; Retract to prevent oozing
  SET_DISPLAY_TEXT MSG="Print Paused"
  PARK_HEAD
  SAVE_VARIABLE VARIABLE=pause_bed_temperature VALUE={printer.heater_bed.target}
  SAVE_VARIABLE VARIABLE=pause_extruder_temperature VALUE={printer.extruder.target}
  SET_HEATER_TEMPERATURE HEATER=extruder
  SET_IDLE_TIMEOUT TIMEOUT=43200 # Set idle_timeout to 12 hours
  
[gcode_macro PARK_HEAD]
description: Move the extruder to the parked position
gcode:
  {% set z_pos = printer.toolhead.position.z | float %}
  SAVE_GCODE_STATE NAME=park_state
  {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes %}
    G28 X Y
  {% endif %}
  {% if z_pos <= 240.0 %}
    MOVE_UP Z=10
  {% endif %}
  G90 ; Absolute Positioning
  G1 X-3 Y219 f50000; Park with model at front
  RESTORE_GCODE_STATE NAME=park_state
  
[gcode_macro PREHEAT]
gcode:
  UPDATE_DELAYED_GCODE ID=HEATER_BED_TIMEOUT DURATION=0
  {% set default_temp = printer.save_variables.variables.last_bed_temperature | default(60) | int %}
  {% set bed_temp = params.T | default(default_temp) | int %}
  {% set message = params.M | default("Enclosure Preheat") | string %}
  M107 ; turn off fans
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET=150; turn off extruder heater
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed_temp}
  RESPOND PREFIX=PREHEAT: MSG="Heating Bed to {bed_temp}"
  {% if printer.toolhead.homed_axes != "xyz" %}
    G28
  {% endif %}
  SAVE_GCODE_STATE NAME=preheat_state
  G90
  G0 X117.5 Y117.5 Z5 F50000
  SET_DISPLAY_TEXT MSG="{message}"
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={ bed_temp - 1 }
  RESPOND PREFIX=PREHEAT: MSG="At set bed temperature of {bed_temp}"
  SET_DISPLAY_TEXT MSG="{message}"
  M106 S150
  RESPOND PREFIX=PREHEAT: MSG="Fans on"
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={ bed_temp - 1 } MAXIMUM={ bed_temp + 1}
  RESPOND PREFIX=PREHEAT: MSG="Preheat Done"
  
[gcode_macro RESUME_ACTION]
description: Actions to take before resume
gcode:
  SET_DISPLAY_TEXT MSG="Heating"
  HEAT_ON_RESUME
  SET_DISPLAY_TEXT MSG="Print Resuming"
  G11 ; Unretract/prime to prepare to resume
  SET_IDLE_TIMEOUT TIMEOUT=900 # Set idle_timeout to 15 minutes
  RESUME
  
[gcode_macro RUNOUT_DETECT]
description:  actions to take after a filament runout is detected
gcode:
  PAUSE
  SAVE_GCODE_STATE NAME=runout_state
  SET_DISPLAY_TEXT MSG="FILAMENT OUT"
  G10 ; Retract to prevent oozing
  PARK_HEAD
  SET_HEATER_TEMPERATURE HEATER=extruder ; turn off extruder heater
  M107 ; turn fan off
  RESTORE_GCODE_STATE NAME=runout_state
  
[gcode_macro START_PRINT]
description:  Macro to start print from Octoprint
gcode:
  {% set extruder_temp = params.E | default(150) | int %}
  {% set skip_home = params.S | default(no) | string %}
  {% set MATERIAL = params.M | default(unk) | string %}
  
  # Get temperatures from slicer (passed as BED_TEMP)
  {% set BED_TEMP = params.B|default(60)|int %}
  {% set MESH_NAME = BED_TEMP ~ "bed_mesh" %}

  # Heat the bed first
  PREHEAT T={BED_TEMP} M="Job Preheat"
    
  # Check if the specific temperature mesh exists
  {% if MESH_NAME in printer.bed_mesh.profiles %}
    { action_respond_info("Found existing mesh: " ~ MESH_NAME ~ ". Loading...") }
    BED_MESH_PROFILE LOAD={MESH_NAME}
  {% else %}
    { action_respond_info("No mesh found for " ~ BED_TEMP ~ "C. Calibrating now...") }
    MESH_CALIBRATE_TEMP
  {% endif %}

  SET_HEATER_TEMPERATURE HEATER=extruder TARGET=150
  M107 ; turn off fans
  {% if skip_home == "no" %}
    G28
  {% endif %}  
  SET_DISPLAY_TEXT MSG="Heating Hotend"
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET={extruder_temp} ; Start heating bed to final temp in gcode file
  PARK_HEAD
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder_temp - 1}
  G92 E0 ; Reset extruder position
  {% if MATERIAL | upper == 'PLA' %}
    ENCLOSURE_FAN_ON
  {% endif %}
  SET_DISPLAY_TEXT MSG="Starting Print"
