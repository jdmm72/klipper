# This file contains pin mappings for the stock 2020 Creality Ender 3
# V2. REPROGRAMMED FOR ENDER 3 NEO To use this config, during "make menuconfig" select the
# STM32F103 with a "28KiB bootloader" and serial (on USART1 PA10/PA9)
# communication.

# If you prefer a direct serial connection, in "make menuconfig"
# select "Enable extra low-level configuration options" and select
# serial (on USART3 PB11/PB10), which is broken out on the 10 pin IDC
# cable used for the LCD module as follows:
# 3: Tx, 4: Rx, 9: GND, 10: VCC

# Flash this firmware by copying "out/klipper.bin" to a SD card and
# turning on the printer with the card inserted. The firmware
# filename must end in ".bin" and must not match the last filename
# that was flashed.

# See docs/Config_Reference.md for a description of parameters.

[include gcode.cfg]
[include extended_gcode.cfg]
#[include delayed_gcode.cfg]
#[include resonance_tester.cfg]

[bed_mesh]
speed: 240
horizontal_move_z: 7
mesh_min: 1, 20
mesh_max: 205, 225
probe_count: 10, 10
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0

[bltouch]
sensor_pin: ^PB1
control_pin: PB0 
x_offset: -46
y_offset: -14

[display]
lcd_type: st7920
cs_pin: PB12
sclk_pin: PB13
sid_pin: PB15
encoder_pins: ^PB14, ^PB10
click_pin: ^!PB2

[exclude_object] 

[extruder]
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 7.13 # e-steps was 34.406 but 32.473 in creality sonic pad config
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: 0
max_temp: 315
max_extrude_only_distance: 500

[fan]
pin: PA0

[filament_switch_sensor filament_sensor]
switch_pin: ^!PA4
pause_on_runout: False
runout_gcode: RUNOUT_DETECT

[firmware_retraction]
retract_length: 2.50
retract_speed: 50
unretract_extra_length: 0
unretract_speed: 50

[force_move]
enable_force_move: True

[heater_bed]
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
min_temp: 0
max_temp: 130

[homing_override]
axes: z
set_position_z: 0
gcode:
  {% set sv = printer.save_variables.variables %}
  {% set max_z = 100.0 | float %}
  {% set hop_amount = 5.0 %}
  
  # Center of Bed
  {% set target_x = 117.5 %}
  {% set target_y = 117.5 %}
  
  # Your updated offsets
  {% set x_offset = -46.0 %}
  {% set y_offset = -14.0 %}

  # 1. Recall Z position
  {% if 'z' not in printer.toolhead.homed_axes %}
    {% if sv.last_z_pos is defined %}
      SET_KINEMATIC_POSITION Z={sv.last_z_pos}
    {% else %}
      SET_KINEMATIC_POSITION Z=0
    {% endif %}
  {% endif %}

  # 2. Safe Z-Hop
  {% set current_z = printer.toolhead.position.z %}
  {% if current_z < (max_z - hop_amount) %}
    G91
    G1 Z{hop_amount} F600
    G90
  {% else %}
    { action_respond_info("Z too high for hop! Skipping Z-hop.") }
    G90
	G1 Z50 F600
  {% endif %}

  # 3. Home X and Y
  G28 X Y

  # 4. Position for CR-Touch (X163.5, Y131.5)
  G1 X{target_x - x_offset} Y{target_y - y_offset} F3000

  # 5. Home Z
  G28 Z

[idle_timeout]
gcode:  
  SET_HEATER_TEMPERATURE HEATER=extruder

[input_shaper]
shaper_freq_x: 67.6
shaper_type_x: mzv
damping_ratio_x: 0.1
shaper_freq_y: 36.2
shaper_type_y: mzv
damping_ratio_y: 0.1

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[pause_resume] 
recover_velocity: 50

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 3000
max_z_velocity: 10
max_z_accel: 800

[respond]
default_type: command

[save_variables]
filename: ~/printer_data/config/variables.cfg

[screws_tilt_adjust]
screw1: 41,39
screw1_name: front left screw
screw2: 185,39
screw2_name: front right screw
screw3: 185,196
screw3_name: rear right screw
screw4: 41,196
screw4_name: rear left screw
horizontal_move_z: 10
speed: 50
screw_thread: CW-M4

[stepper_x]
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40.1618025751073
endstop_pin: ^PA5
position_endstop: -3
position_min: -3
position_max: 258
homing_speed: 50

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 39.89463497615401
endstop_pin: ^PA6
position_endstop: -7
position_min: -7
position_max: 241
homing_speed: 50

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 4
endstop_pin: probe:z_virtual_endstop
position_max: 255
position_min: -10
homing_speed: 10
second_homing_speed: 1
homing_retract_dist: 2.0

[verify_heater heater_bed]

[verify_heater extruder]
check_gain_time: 40
max_error: 240

[virtual_sdcard]
path: ~/.octoprint/uploads/

# These includes are purposely at the end to override any previous setting
